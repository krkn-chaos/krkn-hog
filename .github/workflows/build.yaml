name: Build
on:
  push:
    tags:
      - '*'
  pull_request:
permissions:
  pull-requests: write
  contents: write
jobs:
  build-image:
    name: Build and push container image
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build the Docker images
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build --no-cache \
            --platform linux/${{ matrix.platform }} \
            -f Containerfile \
            -t quay.io/krkn-chaos/krkn-hog:latest \
            .

      - name: Login in quay
        if: startsWith(github.ref, 'refs/tags')
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Build and push arch-specific images
        if: startsWith(github.ref, 'refs/tags')
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker buildx build --no-cache \
            --platform linux/${{ matrix.platform }} \
            -f Containerfile \
            -t quay.io/krkn-chaos/krkn-hog:latest-${{ matrix.platform }} \
            -t quay.io/krkn-chaos/krkn-hog:${TAG}-${{ matrix.platform }} \
            . \
            --push

  manifest:
    runs-on: ubuntu-latest
    needs: build-image
    if: startsWith(github.ref, 'refs/tags')
    steps:
      - name: Login in quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Create and push multi-arch manifests
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          docker manifest create quay.io/krkn-chaos/krkn-hog:${TAG} \
            quay.io/krkn-chaos/krkn-hog:${TAG}-amd64 \
            quay.io/krkn-chaos/krkn-hog:${TAG}-arm64
          docker manifest push quay.io/krkn-chaos/krkn-hog:${TAG}

          docker manifest create quay.io/krkn-chaos/krkn-hog:latest \
            quay.io/krkn-chaos/krkn-hog:latest-amd64 \
            quay.io/krkn-chaos/krkn-hog:latest-arm64
          docker manifest push quay.io/krkn-chaos/krkn-hog:latest
